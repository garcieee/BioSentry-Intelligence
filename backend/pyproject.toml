[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biosentry"
version = "0.1.0"
description = "BioSentry Intelligence backend: contract schemas (CP1); API and domain code follow."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
