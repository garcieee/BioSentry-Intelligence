[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biosentry"
version = "0.1.0"
description = "BioSentry Intelligence backend: contract schemas (CP1); API and domain code follow."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests/contract"]

[tool.ruff.lint]
# No blanket ignores: every rule below applies everywhere.
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "PT", "RUF", "S", "T20", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# Only the assert-based test idiom: pytest tests assert by design (S101), nothing else.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests/contract"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
