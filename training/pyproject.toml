[project]
name = "biosentry-training"
version = "0.0.0"
description = "Offline training scripts for BioSentry Tier B/C models (spike); not part of the application"
requires-python = ">=3.11,<3.12"
readme = "README.md"
# Exact pins, as everywhere in this repo (no caret or tilde ranges).
dependencies = [
  "numpy==2.4.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "wfdb==4.3.1",
  "torch==2.14.1",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
]

[tool.setuptools]
py-modules = []   # scripts only; nothing to import
